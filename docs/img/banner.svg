<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Semana de Arquitetura AWS">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dcc3"/>
      <stop offset="1" stop-color="#cfc2a3"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ead6"/>
      <stop offset="0.5" stop-color="#9c8f72"/>
      <stop offset="1" stop-color="#5a5040"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#e3d9c0"/>
    </radialGradient>
    <linearGradient id="keyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/><stop offset="1" stop-color="#d6c9a8"/>
    </linearGradient>
    <linearGradient id="keyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef7a5e"/><stop offset="1" stop-color="#a8331d"/>
    </linearGradient>
    <linearGradient id="keyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd39a"/><stop offset="1" stop-color="#4e8a4a"/>
    </linearGradient>
    <linearGradient id="keyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6250"/><stop offset="1" stop-color="#3a3328"/>
    </linearGradient>
    <radialGradient id="lampR"><stop offset="0" stop-color="#ffd2c4"/><stop offset="0.45" stop-color="#e5482a"/><stop offset="1" stop-color="#8f2512"/></radialGradient>
    <radialGradient id="lampY"><stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="#f0b429"/><stop offset="1" stop-color="#9a6d0c"/></radialGradient>
    <radialGradient id="lampG"><stop offset="0" stop-color="#e2ffd9"/><stop offset="0.45" stop-color="#5fbf55"/><stop offset="1" stop-color="#2e6b28"/></radialGradient>

    <!-- mostrador: escala de 240°, 0 = topo; ponteiro definido em cada instância -->
    <g id="dialBase">
      <circle r="40" fill="#3a3328"/>
      <circle r="38" fill="url(#bezel)"/>
      <circle r="32" fill="url(#dial)" stroke="#5a5040" stroke-width="1"/>
      <path d="M22.83 -7.42 A24 24 0 0 1 20.78 12" fill="none" stroke="#c0392b" stroke-width="4"/>
      <path d="M-20.78 12 A24 24 0 0 1 -12 -20.78" fill="none" stroke="#6fae6a" stroke-width="4" opacity="0.8"/>
      <path d="M-24.25 14 A28 28 0 1 1 24.25 14" fill="none" stroke="#2b261d" stroke-width="5" stroke-dasharray="0.8 5.065"/>
      <path d="M-24.25 14 A28 28 0 1 1 24.25 14" fill="none" stroke="#2b261d" stroke-width="8" stroke-dasharray="1.6 21.86"/>
    </g>
    <g id="dialTop">
      <circle r="4" fill="#3a3328"/><circle r="1.6" fill="#c9b98f"/>
      <ellipse cx="-8" cy="-14" rx="18" ry="9" fill="#ffffff" opacity="0.28" transform="rotate(-30 -8 -14)"/>
    </g>
    <g id="needle">
      <polygon points="-1.6,6 1.6,6 0.5,-26 -0.5,-26" fill="#b5321e"/>
    </g>

    <g id="key">
      <rect x="0" y="2" width="18" height="13" rx="2.5" fill="#3a3328" opacity="0.55"/>
      <rect width="18" height="13" rx="2.5" stroke="#5a5040" stroke-width="0.8"/>
      <rect x="2" y="1.5" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>
    </g>
    <g id="toggle">
      <rect x="-9" y="-12" width="18" height="24" rx="3" fill="url(#keyD)" stroke="#2b261d"/>
      <circle r="5" fill="#9c8f72" stroke="#2b261d"/>
      <line x1="0" y1="0" x2="0" y2="-11" stroke="#e3d9c0" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- parede com mural -->
  <!-- mosaico radial em tons pastel saindo do sol -->
  <rect width="1200" height="360" fill="#f3e6c8"/>
  <!-- arte afastada (escala 0.6) com o sol na lateral direita, fora do console -->
  <g transform="translate(1120 60) scale(0.6) translate(-900 -70)">
  <g opacity="0.9" transform="translate(900 70) scale(2) translate(-900 -70)">
    <polygon points="900,70 2200,70 2026,720" fill="#a8d5c2"/>
    <polygon points="900,70 2026,720 1550,1196" fill="#f2c9a0"/>
    <polygon points="900,70 1550,1196 900,1370" fill="#c9e0de"/>
    <polygon points="900,70 900,1370 250,1196" fill="#e3b46b"/>
    <polygon points="900,70 250,1196 -226,720" fill="#a8d5c2"/>
    <polygon points="900,70 -226,720 -400,70" fill="#d8b98a"/>
    <polygon points="900,70 -400,70 -226,-580" fill="#8fc1b0"/>
    <polygon points="900,70 -226,-580 250,-1056" fill="#f2c9a0"/>
    <polygon points="900,70 250,-1056 900,-1230" fill="#c9e0de"/>
    <polygon points="900,70 900,-1230 1550,-1056" fill="#e3b46b"/>
    <polygon points="900,70 1550,-1056 2026,-580" fill="#8fc1b0"/>
    <polygon points="900,70 2026,-580 2200,70" fill="#f2c9a0"/>
  </g>
  <!-- anéis concêntricos que quebram o mosaico em ladrilhos -->
  <g fill="none" stroke="#fbf5e6" opacity="0.55">
    <circle cx="900" cy="70" r="420" stroke-width="10"/>
    <circle cx="900" cy="70" r="600" stroke-width="6"/>
    <circle cx="900" cy="70" r="800" stroke-width="10"/>
  </g>
  <circle cx="900" cy="70" r="230" fill="#c9e0de" opacity="0.55" stroke="#fbf5e6" stroke-width="14"/>
  <!-- sol com raios em chama e disco dividido -->
  <g transform="translate(900 70)">
    <g fill="#e9b949">
      <path id="ray" d="M-12 -52 Q-4 -86 6 -112 Q4 -84 12 -52 Z"/>
      <use href="#ray" transform="rotate(22.5)"/><use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(67.5)"/>
      <use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(112.5)"/><use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(157.5)"/><use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(202.5)"/>
      <use href="#ray" transform="rotate(225)"/><use href="#ray" transform="rotate(247.5)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(292.5)"/><use href="#ray" transform="rotate(315)"/><use href="#ray" transform="rotate(337.5)"/>
    </g>
    <circle r="54" fill="#f6dfa0"/>
    <path d="M-38.2 38.2 A54 54 0 0 0 38.2 -38.2 Z" fill="#d9a24e"/>
  </g>
  </g>
  <!-- leque secundário saindo do planeta para preencher o lado esquerdo -->
  <g transform="translate(60 318)" opacity="0.75">
    <polygon points="0,0 420,-260 520,-120" fill="#c9e0de"/>
    <polygon points="0,0 520,-120 540,40" fill="#f2c9a0"/>
    <polygon points="0,0 540,40 480,220" fill="#a8d5c2"/>
    <polygon points="0,0 480,220 300,260" fill="#e3b46b"/>
    <polygon points="0,0 260,-300 420,-260" fill="#8fc1b0"/>
    <polygon points="0,0 -120,-260 120,-300" fill="#f2c9a0"/>
    <polygon points="0,0 -120,260 160,260" fill="#c9e0de"/>
  </g>
  <!-- órbita grande atravessando o mural -->
  <ellipse cx="600" cy="180" rx="590" ry="165" fill="none" stroke="#fbf5e6" stroke-width="8" opacity="0.7"/>
  <ellipse cx="600" cy="180" rx="520" ry="130" fill="none" stroke="#8fc1b0" stroke-width="3" opacity="0.6"/>
  <!-- planeta com anel (Saturno), no alto à esquerda -->
  <g transform="translate(230 50) rotate(-12)">
    <circle r="20" fill="#e3b46b"/>
    <path d="M-20 0 A20 20 0 0 0 20 0 Z" fill="#c98f6b"/>
    <ellipse rx="40" ry="8" fill="none" stroke="#f2c9a0" stroke-width="4"/>
  </g>
  <!-- pequeno planeta, como no mural -->
  <g transform="translate(60 318)">
    <circle r="30" fill="#f3e6c8" stroke="#8fc1b0" stroke-width="4"/>
    <path d="M-30 0 A30 30 0 0 0 30 0 Z" fill="#f2c9a0"/>
    <circle cx="-38" cy="26" r="8" fill="#8fc1b0"/>
  </g>

  <!-- console reduzido e centralizado -->
  <g transform="translate(90 44) scale(0.85)">
  <!-- console -->
  <rect x="30" y="34" width="1140" height="240" rx="6" fill="#a89878"/>
  <rect x="38" y="40" width="1124" height="226" rx="4" fill="url(#face)" stroke="#8a7d62"/>
  <line x1="38" y1="236" x2="1162" y2="236" stroke="#8a7d62"/>

  <!-- placa do título -->
  <rect x="62" y="72" width="620" height="110" rx="4" fill="#2a2a22" stroke="#5a5040" stroke-width="3"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#f0a830">
    <text x="86" y="104" font-size="18" letter-spacing="4" opacity="0.8">PAINEL</text>
    <text x="86" y="152" font-size="40" font-weight="700" letter-spacing="1">SEMANA DE ARQUITETURA AWS</text>
  </g>

  <!-- mostradores: cada um mede uma grandeza -->
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <g transform="translate(760 104)">
      <use href="#dialBase"/>
      <text y="18" font-size="8" fill="#5a5040">req/s</text>
      <text x="-17" y="26" font-size="8" fill="#3a3328">0</text><text x="17" y="26" font-size="8" fill="#3a3328">1k</text>
      <use href="#needle" transform="rotate(48)"/><use href="#dialTop"/>
    </g>
    <g transform="translate(870 104)">
      <use href="#dialBase"/>
      <text y="18" font-size="8" fill="#5a5040">CPU %</text>
      <text x="-17" y="26" font-size="8" fill="#3a3328">0</text><text x="17" y="26" font-size="8" fill="#3a3328">100</text>
      <use href="#needle" transform="rotate(-12)"/><use href="#dialTop"/>
    </g>
    <g transform="translate(980 104)">
      <use href="#dialBase"/>
      <text y="18" font-size="8" fill="#5a5040">conexões</text>
      <text x="-17" y="26" font-size="8" fill="#3a3328">0</text><text x="17" y="26" font-size="8" fill="#3a3328">200</text>
      <use href="#needle" transform="rotate(-48)"/><use href="#dialTop"/>
    </g>
    <g transform="translate(1090 104)">
      <use href="#dialBase"/>
      <text y="18" font-size="8" fill="#5a5040">instâncias</text>
      <text x="-17" y="26" font-size="8" fill="#3a3328">1</text><text x="17" y="26" font-size="8" fill="#3a3328">6</text>
      <use href="#needle" transform="rotate(72)"/><use href="#dialTop"/>
    </g>
    <g font-size="12" font-weight="700" fill="#3a3328" letter-spacing="1">
      <rect x="732" y="152" width="56" height="16" rx="2" fill="#f4eee0" stroke="#8a7d62"/><text x="760" y="164">WEB</text>
      <rect x="842" y="152" width="56" height="16" rx="2" fill="#f4eee0" stroke="#8a7d62"/><text x="870" y="164">APP</text>
      <rect x="946" y="152" width="68" height="16" rx="2" fill="#f4eee0" stroke="#8a7d62"/><text x="980" y="164">DADOS</text>
      <rect x="1062" y="152" width="56" height="16" rx="2" fill="#f4eee0" stroke="#8a7d62"/><text x="1090" y="164">ASG</text>
    </g>
  </g>

  <!-- teclas -->
  <g>
    <use href="#key" x="728" y="184" fill="url(#keyC)"/><use href="#key" x="751" y="184" fill="url(#keyC)"/><use href="#key" x="774" y="184" fill="url(#keyG)"/>
    <use href="#key" x="838" y="184" fill="url(#keyC)"/><use href="#key" x="861" y="184" fill="url(#keyR)"/><use href="#key" x="884" y="184" fill="url(#keyC)"/>
    <use href="#key" x="948" y="184" fill="url(#keyG)"/><use href="#key" x="971" y="184" fill="url(#keyC)"/><use href="#key" x="994" y="184" fill="url(#keyC)"/>
    <use href="#key" x="1058" y="184" fill="url(#keyC)"/><use href="#key" x="1081" y="184" fill="url(#keyC)"/><use href="#key" x="1104" y="184" fill="url(#keyR)"/>
  </g>

  <!-- lâmpadas e interruptores -->
  <g stroke="#5a5040" stroke-width="2">
    <circle cx="90" cy="251" r="8" fill="url(#lampR)"/>
    <circle cx="116" cy="251" r="8" fill="url(#lampY)"/>
    <circle cx="142" cy="251" r="8" fill="url(#lampG)"/>
  </g>
  <use href="#toggle" x="200" y="251"/><use href="#toggle" x="226" y="251"/><use href="#toggle" x="252" y="251" transform="rotate(180 252 251)"/>
  <g fill="url(#keyD)" stroke="#2b261d">
    <rect x="300" y="244" width="22" height="14" rx="2"/><rect x="328" y="244" width="22" height="14" rx="2"/>
    <rect x="356" y="244" width="22" height="14" rx="2"/><rect x="384" y="244" width="22" height="14" rx="2"/>
  </g>
  </g>
</svg>
